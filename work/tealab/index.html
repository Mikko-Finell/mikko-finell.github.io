<!doctype html>
<html lang="en" data-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mikko Finell — Tealab" />
    <title>Mikko Finell — Tealab</title>
    <script>
      try {
        const mode = localStorage.getItem("cv-color-mode");
        if (mode === "light" || mode === "dark" || mode === "system") {
          document.documentElement.dataset.mode = mode;
          document.documentElement.style.colorScheme =
            mode === "system" ? "light dark" : mode;
        }
      } catch {}
    </script>
    <link rel="stylesheet" href="/src/styles/site.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/tealab.tsx"></script>
  </body>
</html>
